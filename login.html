<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShieldOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" id="loginPage">
    <div class="container auth-wrapper">
        <div class="auth-card">
            <div class="auth-card-top text-center mb-4">
                <div class="auth-icon mb-3"><i class="fa-solid fa-lock"></i></div>
                <h2 class="mb-2 text-primary">Welcome Back</h2>
                <p class="text-muted">Sign in to access your ShieldOS dashboard.</p>
            </div>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control form-control-custom" id="loginEmail" name="email" required autocomplete="email" autofocus>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-custom" id="loginPassword" name="password" required minlength="8" autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="loginTogglePassword"><i class="fa-solid fa-eye" id="loginEyeIcon"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger w-100">Login</button>
            </form>
            <div id="loginMessage" class="mt-3"></div>
            <p class="mt-4 text-center text-muted">Don’t have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ShieldOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" id="signupPage">
    <div class="container auth-wrapper">
        <div class="auth-card">
            <div class="auth-card-top text-center mb-4">
                <div class="auth-icon mb-3"><i class="fa-solid fa-user-plus"></i></div>
                <h2 class="mb-2 text-primary">Create Your Account</h2>
                <p class="text-muted">Register to use ShieldOS and protect your passwords.</p>
            </div>
            <form id="signupForm" novalidate>
                <div class="mb-3">
                    <label for="signupFullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control form-control-custom" id="signupFullName" name="full_name" required autocomplete="name" autofocus>
                </div>
                <div class="mb-3">
                    <label for="signupEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control form-control-custom" id="signupEmail" name="email" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="signupPassword" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-custom" id="signupPassword" name="password" required minlength="8" autocomplete="new-password">
                        <button class="btn btn-outline-secondary" type="button" id="signupTogglePassword"><i class="fa-solid fa-eye" id="signupEyeIcon"></i></button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control form-control-custom" id="signupConfirmPassword" name="confirm_password" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-danger w-100">Sign Up</button>
            </form>
            <div id="signupMessage" class="mt-3"></div>
            <p class="mt-4 text-center text-muted">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
